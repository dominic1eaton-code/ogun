# --- Required Metadata ---
sonar.projectKey=my-unique-project-key
sonar.projectName=My Project Name
sonar.projectVersion=1.0

# --- Server Connection (Optional if configured in CI environment) ---
sonar.host.url=https://your-sonarqube-server.com
# Use sonar.organization if you are using SonarCloud instead of SonarQube Server
# sonar.organization=my-sonarcloud-org

# --- Paths to Source Code ---
# Comma-separated paths to source directories. Relative to this file.
sonar.sources=src
# Comma-separated paths to test directories.
sonar.tests=test

# --- Code Encodings ---
sonar.sourceEncoding=UTF-8

# --- Coverage & Exclusions ---
# Exclude third-party or auto-generated code from analysis
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**
# Exclude test files or specific layouts from coverage reports
sonar.coverage.exclusions=**/*.test.js, **/__tests__/**
