##############################################################################
# .gitlab-ci.yml — ogun (umbrella monorepo)
# Repository: https://gitlab.com/ogun-foundation/ogun
# Language:   Rust (edition 2024) + Tauri 2 (Node/npm)
# Target:     Windows x64 Desktop Edition (0.1.0-beta)
#
# All shared templates are sourced from ogun-devops/ogun-cicd.
# Local overrides follow each include block.
##############################################################################

include:
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/configure.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/validate.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/check.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/test.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/build.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/sast.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/package.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/deploy.yml'
  - project: 'ogun-foundation/ogun-devops'
    ref: main
    file: 'ogun-cicd/version.yml'

# ---------------------------------------------------------------------------
# Stage ordering — extends the shared set with umbrella-specific stages
# ---------------------------------------------------------------------------
stages:
  - validate
  - check
  - test
  - build
  - components
  - audit
  - pages
  - release
  - version

# ---------------------------------------------------------------------------
# Submodule initialisation — runs before every job in this repo.
# Override the default before_script to add recursive submodule checkout.
# ---------------------------------------------------------------------------
default:
  image: rust:latest
  before_script:
    # SSH-based submodule URLs require a deploy key with read access.
    # Store the private key in CI/CD variable OGUN_SUBMODULE_DEPLOY_KEY
    # as a File variable, then uncomment the two lines below:
    #   - eval $(ssh-agent -s)
    #   - ssh-add "$OGUN_SUBMODULE_DEPLOY_KEY"
    #
    # Alternatively, use HTTPS with CI_JOB_TOKEN:
    #   - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - git submodule sync --recursive
    - git submodule update --init --recursive --depth 1 --jobs 8
    - rustup show
    - rustup component add rustfmt clippy
    - cargo --version
    - rustc --version
  interruptible: true

# ---------------------------------------------------------------------------
# Variables — umbrella-specific additions
# ---------------------------------------------------------------------------
variables:
  OGUN_MAIN_BRANCH: "main"
  OGUN_DEV_BRANCH: "develop"
  EXPECTED_SUBMODULES: >-
    bula elegua jaku oya rustydb
    ogun-sdk ogun-runtime ogun-devices
    ogun-os ogun-components ogun-apps ogun-tools
    ogun-artifacts ogun-config ogun-devops
    ogun-docs ogun-sites ogun-test-features

# ---------------------------------------------------------------------------
# STAGE: validate — override to use umbrella submodule list
# ---------------------------------------------------------------------------
validate:workspace:
  extends: .job_validate_workspace

validate:submodules:
  extends: .job_validate_submodules
  variables:
    EXPECTED_SUBMODULES: >-
      bula elegua jaku oya rustydb
      ogun-sdk ogun-runtime ogun-devices
      ogun-os ogun-components ogun-apps ogun-tools
      ogun-artifacts ogun-config ogun-devops
      ogun-docs ogun-sites ogun-test-features

# ---------------------------------------------------------------------------
# STAGE: check — per-subworkspace clippy for targeted feedback
# ---------------------------------------------------------------------------
clippy:sdk:
  extends: .job_clippy_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-sdk
  needs: [validate:workspace]

clippy:runtime:
  extends: .job_clippy_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-runtime
  needs: [validate:workspace]

clippy:components:
  extends: .job_clippy_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-components
  needs: [validate:workspace]

clippy:apps:
  extends: .job_clippy_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-apps
  needs: [validate:workspace]

clippy:devices:
  extends: .job_clippy_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-devices
  needs: [validate:workspace]

clippy:support-crates:
  extends: .cargo_cache
  stage: check
  script:
    - cd elegua && cargo clippy --workspace -- -D warnings
    - cd ../jaku && cargo clippy --workspace -- -D warnings
    - cd ../oya  && cargo clippy --workspace -- -D warnings
    - cd ../rustydb && cargo clippy --workspace -- -D warnings
  needs: [validate:workspace]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---------------------------------------------------------------------------
# STAGE: test — per-subworkspace parallel tests on MRs
# ---------------------------------------------------------------------------
test:sdk:
  extends: .job_test_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-sdk
  needs: [validate:workspace]

test:runtime:
  extends: .job_test_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-runtime
  needs: [validate:workspace]

test:devices:
  extends: .job_test_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-devices
  needs: [validate:workspace]

test:apps:
  extends: .job_test_subworkspace
  variables:
    SUBWORKSPACE_DIR: ogun-apps
  needs: [validate:workspace]

test:support-crates:
  extends: .cargo_cache
  stage: test
  script:
    - cd elegua  && cargo test --workspace --verbose
    - cd ../jaku && cargo test --workspace --verbose
    - cd ../oya  && cargo test --workspace --verbose
    - cd ../rustydb && cargo test --workspace --verbose
  needs: [validate:workspace]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---------------------------------------------------------------------------
# STAGE: build — Tauri desktop + setup tool (Windows x64)
# ---------------------------------------------------------------------------
build:tauri:desktop:
  extends: .job_build_tauri_desktop
  variables:
    TAURI_APP_DIR: "ogun-os/src/ogun-desktop"
  needs:
    - job: test:workspace
      optional: true

build:tauri:setup:
  extends: .job_build_tauri_setup
  variables:
    TAURI_SETUP_DIR: "ogun-tools/src/ogun-setup"
  needs:
    - job: test:workspace
      optional: true

# ---------------------------------------------------------------------------
# STAGE: components — ogun-components dylib build
# ---------------------------------------------------------------------------
build:components:
  extends: .job_build_components_linux
  script:
    - cd ogun-components && cargo build --workspace --release --verbose
  artifacts:
    name: "ogun-components-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ogun-components/target/release/*.dll
      - ogun-components/target/release/*.so
      - ogun-components/target/release/*.dylib
    expire_in: 30 days
  needs: [build:release]

# ---------------------------------------------------------------------------
# STAGE: pages — unified rustdoc for the full workspace
# ---------------------------------------------------------------------------
pages:
  extends: .job_pages
  variables:
    DEFAULT_DOC_CRATE: ogun_runtime
  needs:
    - job: build:release
      optional: true

# ---------------------------------------------------------------------------
# STAGE: release — GitLab Release on semver tags
# ---------------------------------------------------------------------------
release:
  extends: .job_release_desktop
  needs:
    - job: build:tauri:desktop
      artifacts: true
    - job: build:tauri:setup
      artifacts: true
    - job: build:components
      artifacts: true
